[package]
name = "totils"
version = "1.0.0"
edition = "2024"
authors = ["Michael Bachmann <mbachmann@bbmsoft.net>"]
description = "Re-usable patterns for tokio based async applications."
repository = "https://github.com/babymotte/totils"
license = "MIT OR Apache-2.0"
keywords = ["tokio", "async", "utils"]
categories = ["asynchronous"]

[dependencies]
tokio = { version = "1.53.1", optional = true }
tracing = { version = "0.1.44", optional = true }
paste = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }

[features]
default = []
while_select = ["tokio/macros", "tokio/rt", "tokio/sync"]
mpsc_multiplexer = ["tokio/macros", "tokio/time", "tracing", "paste"]

[lints.rust]
# unsafe_code = "forbid"

[lints.clippy]
all = "deny"
enum_glob_use = "deny"
# pedantic = "deny"
# nursery = "deny"
unwrap_used = "deny"
